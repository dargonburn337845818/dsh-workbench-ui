name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # peerDependencies 指向未公开发布的 DSH 宿主包，必须 --legacy-peer-deps。
      # 构建与 smoke 测试依赖 DSH 宿主类型/运行时，在本地环境做；CI 只保证依赖可安装。
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck (non-blocking; needs DSH host types)
        run: npm run typecheck
        continue-on-error: true
